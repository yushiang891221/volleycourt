<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRoid 頭一覽</title>
<style>html,body{margin:0;background:#E6EAF0;font-family:sans-serif}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
// 開發用：把 assets/models/vroid 裡裁好的頭一格一格畫出來（動畫風上色、標名字），方便挑款式
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const NAMES = ['hairsample_male', 'base_male', 'sakurada_fumiriya', 'avatarsample_d', 'avatarsample_d_darkness', 'avatarsample_e', 'avatarsample_f', 'avatarsample_g', 'base_female', 'hairsample_female', 'sendagaya_shino'];
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xE6EAF0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(1.5, 2.5, -3); scene.add(sun);
const RAMP = (() => { const d = new Uint8Array([178, 168, 172, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 2, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const L = new GLTFLoader(), heads = [], TW = 300, TH = 340, cols = 4;
const sheet = document.createElement('canvas'); sheet.width = TW * cols; sheet.height = TH * Math.ceil(NAMES.length / cols); const sg = sheet.getContext('2d');
sg.fillStyle = '#E6EAF0'; sg.fillRect(0, 0, sheet.width, sheet.height);
R.setSize(TW, TH); const cam = new THREE.PerspectiveCamera(20, TW / TH, 0.05, 50);
for (const [i, n] of NAMES.entries()) {
  try {
    const g = await L.loadAsync(`../../assets/models/vroid/${n}.glb`);
    const box = new THREE.Box3();
    g.scene.traverse(o => { if (o.isMesh) { const m = o.material; o.material = new THREE.MeshToonMaterial({ map: m.map, gradientMap: RAMP, transparent: m.transparent, alphaTest: m.alphaTest, depthWrite: !m.transparent, side: m.side }); if (/SKIN/.test(m.name)) box.expandByObject(o); } });
    const c = box.getCenter(new THREE.Vector3()), h = box.max.y - box.min.y;
    scene.add(g.scene);
    cam.position.set(c.x + Math.sin(Math.PI + 0.35) * h * 3.6, c.y + h * 0.05, c.z + Math.cos(Math.PI + 0.35) * h * 3.6); cam.lookAt(c.x, c.y + h * 0.02, c.z);
    R.render(scene, cam); sg.drawImage(R.domElement, (i % cols) * TW, Math.floor(i / cols) * TH);
    scene.remove(g.scene); heads.push(n);
  } catch (e) { heads.push(n + ':失敗'); }
  sg.fillStyle = '#000'; sg.font = '18px sans-serif'; sg.fillText((i + 1) + ' ' + n, (i % cols) * TW + 8, Math.floor(i / cols) * TH + 22);
}
const im = document.createElement('img'); im.src = sheet.toDataURL(); im.style.cssText = 'width:100vw;display:block'; document.body.appendChild(im);
window.__heads = heads;
</script></body></html>
