<style>

      bx = lerp(handTop[0], W / 2, Math.min(1, k)); by = lerp(handTop[1], H / 2, Math.min(1, k));

      if (k < 0.35) { ctx.strokeStyle = `rgba(255,255,255,${0.8 - k * 2})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(handTop[0], handTop[1], s * 0.3 + k * s * 3, 0, Math.PI * 2); ctx.stroke(); }
      for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + 0.3, r1 = br * 1.05, r2 = br * (1.25 + 0.25 * k);
        ctx.strokeStyle = `rgba(255,255,255,${0.35 * (1 - k)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx + Math.cos(a) * r1, by + Math.sin(a) * r1); ctx.lineTo(bx + Math.cos(a) * r2, by + Math.sin(a) * r2); ctx.stroke(); }
    }
    drawBall(ctx, bx, by, br, t / 90);
    if (t > 2500) { ctx.fillStyle = `rgba(255,255,255,${ease((t - 2500) / 500)})`; ctx.fillRect(0, 0, W, H); }
    if (t < T) requestAnimationFrame(frame);
    else done();
  }
  requestAnimationFrame(frame);
}

// ================================================================ map
const TW = L.latLngBounds([21.85, 119.95], [25.35, 122.05]);
const map = L.map('map', { zoomControl: false, maxZoom: 20, minZoom: 6, zoomSnap: 0.25, attributionControl: true });
L.control.zoom({ position: 'topright' }).addTo(map);
map.fitBounds(TW);
const nlsc = (layer) => L.tileLayer(`https://wmts.nlsc.gov.tw/wmts/${layer}/default/GoogleMapsCompatible/{z}/{y}/{x}`,
  { maxZoom: 20, maxNativeZoom: 19, attribution: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank" rel="noopener">內政部國土測繪中心</a>' });
nlsc('PHOTO2').addTo(map);
let MAP = null, SITES = null, CRIT = null;
const markers = new Map();
const PING = 3.3058, PL = 25 * 18 / PING, PS = 24 * 15 / PING, COMMON = 40;
// courts laid out in a grid of rows × cols (rotated 90°) plus a 5 m service strip; used by the 3D generator too
function layoutCourts(ping) {
  const A = ping * PING, MAXN = 16, MAXD = 160;
  for (const [type, cw, cd, label] of [['vb', 25, 18, '龍蝦規格 25×18 m'], ['vbs', 24, 15, '精簡規格 24×15 m']]) {
    const cap = Math.min(MAXN, Math.floor((A - COMMON * PING) / (cw * cd)));
    if (cap < 1) continue;
    let best = null;
    for (let r = 1; r <= 8; r++) {
      const W = r * cw + 5, L = A / W;
      if (W > MAXD) break; if (L > MAXD) continue;
      const cols = Math.floor(L / cd), n = Math.min(cap, r * cols);
      if (n < 1) continue;
      const sc = n * 10 - Math.abs(Math.log(L / W / 1.5));
      if (!best || sc > best.sc) best = { type, label, cw, cd, n, rows: r, cols, L, W, sc };
    }
    if (best) return best;
  }
  return null;
}
function fit(s) {
  if (s.ping == null) return { eff: null, lay: null };
  return { eff: s.ping, lay: layoutCourts(s.ping) };
}
function fitText(s) {
  const f = fit(s);
  if (f.eff == null) return '坪數待查';
  if (!f.lay) return '放不下 1 面';
  return f.lay.type === 'vb' ? `${f.lay.n} 面排球` : `${f.lay.n} 面（精簡）`;
}
const DEF = { towns: null, custom: [], pri: ['A', 'B', 'C'], ping: 150, h: 7, hu: true, rent: 0 };
let F = null;
const ALL_TOWNS = ['竹北市', '竹東鎮', '新埔鎮', '關西鎮', '湖口鄉', '新豐鄉', '芎林鄉', '橫山鄉', '北埔鄉', '寶山鄉', '峨眉鄉', '尖石鄉', '五峰鄉', '東區', '北區', '香山區'];
// a chip matches its town exactly, or (for keywords the user typed) anywhere in town / road / name / note
function townHit(s, t) { return s.town === t || (!ALL_TOWNS.includes(t) && [s.town, s.road, s.name, s.note].join(' ').includes(t)); }
function matches(s) {
  if (F.towns && !F.towns.some((t) => townHit(s, t))) return false;
  if (!F.pri.includes(s.pri)) return false;
  const p = s.ping;
  if (F.ping && !(p != null && p >= F.ping) && !(s.total != null && s.total >= F.ping && /打通/.test(s.note))) return false;
  if (F.h && s.height != null && s.height < F.h) return false;
  if (F.h && s.height == null && !F.hu) return false;
  if (F.rent && s.rent != null && s.rent > F.rent * 10000 && !s.split) return false;
  return true;
}
function pinHtml(s, on) {
  const col = { A: '#2E9E5B', B: '#E08A2E', C: '#8A96A6' }[s.pri];
  return `<div class="pin${on ? '' : ' off'}" data-id="${s.id}"><svg viewBox="0 0 50 62" width="50" height="62"><path d="M25 60 C25 60 4 36 4 22 A21 21 0 0 1 46 22 C46 36 25 60 25 60Z" fill="${col}" stroke="#fff" stroke-width="2.5"/></svg><b>${s.pri}</b><span>${esc(fitText(s).replace('排球', ''))}</span></div>`;
}
function popupHtml(s) {
  const f = fit(s);
  const fact = (v, l, wide) => `<div class="fact${wide ? ' wide' : ''}"><b>${v}</b><span>${l}</span></div>`;
  const per = s.rent && s.total ? `${f0(s.rent / s.total)} 元／坪` : '—';
  const links = (s.links || []).map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join('');
  return `<div class="pc-top"><div class="g ${s.pri}">${s.pri}</div><div><h3>${esc(s.name)}</h3><div class="loc">${esc(s.town)}・${esc(s.road)}・離最近球館（${esc(s.near)}）${s.km} km</div></div></div>
  <div class="facts">
    ${fact(s.height != null ? s.height + ' m' : '待量', '挑高')}
    ${fact(s.ping != null ? f0(s.ping) + ' 坪' : '待查', s.total && s.total !== s.ping ? `一樓可用（總 ${f0(s.total)} 坪）` : '一樓可用坪數')}
    ${fact(s.rent != null ? f0(s.rent / 10000) + ' 萬' : '待查', `月租・${per}`)}
    ${fact(esc(fitText(s)), f.lay ? `${f.lay.label}・${f.lay.rows} 排 × ${Math.ceil(f.lay.n / f.lay.rows)} 面` : '依坪數估算')}
    ${fact(esc(s.usage || '—'), '現在用途', true)}
    ${fact(esc([s.zone, s.floor].filter(Boolean).join('・') || '待查'), '使用分區・樓層', true)}
  </div>
  <p class="pc-note">${esc(s.note || '')}</p>
  <div class="pc-links">${links}</div>
  <a class="enter" href="gym.html?site=${encodeURIComponent(s.id)}">進入球館 → 生成 3D 配置</a>`;
}
function renderList() {
  const L2 = [...SITES.sites].sort((a, b) => (matches(b) - matches(a)) || a.pri.localeCompare(b.pri) || (b.ping || 0) - (a.ping || 0));
  const n = SITES.sites.filter(matches).length;
  $('#list').innerHTML = L2.map((s) => `<button type="button" class="item${matches(s) ? '' : ' off'}" role="listitem" data-id="${s.id}"><span class="g ${s.pri}">${s.pri}</span><span class="nm">${esc(s.name)}</span>
    <span class="sp">${esc(s.town)}・${s.ping != null ? f0(s.ping) + ' 坪' : '坪數待查'}・挑高 ${s.height != null ? s.height + ' m' : '待量'}・${s.rent != null ? '月租 ' + f0(s.rent / 10000) + ' 萬' : '租金待查'}・<em>${esc(fitText(s))}</em></span></button>`).join('');
  const upd = new Date(SITES.updated);
  $('#meta').innerHTML = `符合條件 <b>${n}</b>／共 <b>${SITES.sites.length}</b> 筆・每天自動更新<br>上次更新：${upd.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
  for (const s of SITES.sites) { const m = markers.get(s.id); if (m) { m.setIcon(icon(s)); m.setZIndexOffset(matches(s) ? 1000 : 0); } }
  const parts = [];
  if (F.towns) parts.push(F.towns.length <= 2 ? F.towns.join('、') : F.towns.length + ' 個地區'); if (F.ping) parts.push(`≥${F.ping} 坪`); if (F.h) parts.push(`挑高 ≥${F.h} m`); if (F.rent) parts.push(`≤${F.rent} 萬`);
  $('#fsum').textContent = parts.join('・') || '不限';
}
const icon = (s) => L.divIcon({ className: '', html: pinHtml(s, matches(s)), iconSize: [50, 62], iconAnchor: [25, 60], popupAnchor: [0, -56] });
function bindFilters() {
  F.custom = Array.isArray(F.custom) ? F.custom : [];
  const known = () => [...new Set([...ALL_TOWNS, ...(CRIT.towns || []), ...SITES.sites.map((s) => s.town)])];
  const options = () => [...known(), ...F.custom.filter((c) => !known().includes(c))];
  $('#town-list').innerHTML = known().map((t) => `<option value="${esc(t)}">`).join('');
  const draw = () => {
    const opts = options();
    $('#f-town').innerHTML = opts.map((t) => {
      const n = SITES.sites.filter((s) => townHit(s, t)).length, cus = F.custom.includes(t);
      return `<button type="button" data-t="${esc(t)}" class="${n ? '' : 'zero'}${cus ? ' custom' : ''}" aria-pressed="${!F.towns || F.towns.includes(t)}">${esc(t)}<i>${n}</i>${cus ? `<span class="x" data-x="${esc(t)}" title="移除" aria-label="移除 ${esc(t)}">×</span>` : ''}</button>`;
    }).join('');
    $('#f-pri').innerHTML = ['A', 'B', 'C'].map((p) => `<button type="button" data-p="${p}" aria-pressed="${F.pri.includes(p)}">${p} 級</button>`).join('');
    $('#f-ping').value = F.ping; $('#v-ping').textContent = F.ping ? F.ping + ' 坪' : '不限';
    $('#f-h').value = F.h; $('#v-h').textContent = F.h ? F.h + ' m' : '不限';
    $('#f-hu').checked = F.hu;
    $('#f-rent').value = F.rent; $('#v-rent').textContent = F.rent ? F.rent + ' 萬' : '不限';
  };
  const apply = () => { store.set('vb.filters', F); draw(); renderList(); };
  draw();
  $('#f-town').addEventListener('click', (e) => {
    const x = e.target.closest('[data-x]');
    if (x) { const t = x.dataset.x; F.custom = F.custom.filter((c) => c !== t); if (F.towns) F.towns = F.towns.filter((c) => c !== t); apply(); return; }
    const b = e.target.closest('[data-t]'); if (!b) return; const all = options(); const cur = F.towns || all.slice(); const t = b.dataset.t;
    F.towns = cur.includes(t) ? cur.filter((c) => c !== t) : [...cur, t]; if (all.every((c) => F.towns.includes(c))) F.towns = null; apply(); });
  $('#f-addtown').addEventListener('submit', (e) => {
    e.preventDefault(); const inp = $('#f-newtown'); const t = inp.value.trim().replace(/[<>"&]/g, '').slice(0, 20); if (!t) return;
    if (!options().includes(t)) F.custom.push(t);
    // adding a place means "show me this": select it (keep the others that were on)
    F.towns = F.towns ? [...new Set([...F.towns, t])] : null;
    inp.value = ''; apply();
    const n = SITES.sites.filter((s) => townHit(s, t)).length;
    toast(n ? `「${t}」有 ${n} 個候選場地` : `「${t}」目前還沒有候選場地，地區已加入，之後有新物件就會出現`);
  });
  $('#f-all').addEventListener('click', () => { F.towns = null; apply(); });
  $('#f-none').addEventListener('click', () => { F.towns = []; apply(); });
  $('#f-pri').addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (!b) return; const p = b.dataset.p; F.pri = F.pri.includes(p) ? F.pri.filter((x) => x !== p) : [...F.pri, p]; apply(); });
  $('#f-ping').addEventListener('input', (e) => { F.ping = +e.target.value; apply(); });
  $('#f-h').addEventListener('input', (e) => { F.h = +e.target.value; apply(); });
  $('#f-hu').addEventListener('change', (e) => { F.hu = e.target.checked; apply(); });
  $('#f-rent').addEventListener('input', (e) => { F.rent = +e.target.value; apply(); });
  $('#f-reset').addEventListener('click', () => { F = { ...DEF, custom: F.custom, ping: CRIT.minPing ?? 150, h: CRIT.minHeight ?? 7 }; apply(); });
  $('#ftoggle').addEventListener('click', () => { const b = $('#fbody'); b.hidden = !b.hidden; $('#ftoggle').setAttribute('aria-expanded', String(!b.hidden)); });
}
function openSite(id, fly = true) {
  const s = SITES.sites.find((x) => x.id === id), m = markers.get(id); if (!s || !m) return;
  document.querySelectorAll('.item').forEach((el) => el.classList.toggle('on', el.dataset.id === id));
  const go = () => m.openPopup();
  if (fly) { map.once('moveend', go); map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 14), { duration: RM ? 0 : 1.1 }); } else go();
}
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.hidden = false; t.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => { t.style.opacity = 0; setTimeout(() => { t.hidden = true; }, 400); }, ms); }

let layersAdded = false;
function addLayers() {
  if (layersAdded) return; layersAdded = true;
  // region mask
  map.createPane('mask'); map.getPane('mask').style.zIndex = 350; map.getPane('mask').style.pointerEvents = 'none';
  const holes = []; MAP.region.features.forEach((f) => f.geometry.coordinates.forEach((poly) => holes.push(poly[0].map(([x, y]) => [y, x]))));
  L.polygon([[[-89, -179], [-89, 179], [89, 179], [89, -179]], ...holes], { pane: 'mask', stroke: false, fillColor: '#06101C', fillOpacity: 0.55, interactive: false }).addTo(map);
  L.geoJSON(MAP.region, { pane: 'mask', interactive: false, style: { color: '#F2B705', weight: 1.5, opacity: 0.6, dashArray: '2 6', fill: false } }).addTo(map);
  // rings around existing private venues
  const groups = [{ lat: MAP.center[0], lon: MAP.center[1], name: '寶山球館群' }, { lat: MAP.venues[4].lat, lon: MAP.venues[4].lon, name: '排郎' }];
  for (const g of groups) for (const km of [3, 5, 10]) {
    L.circle([g.lat, g.lon], { radius: km * 1000, color: '#F2B705', weight: 1.6, dashArray: '6 6', fillColor: '#F2B705', fillOpacity: km === 3 ? 0.08 : 0.03, interactive: false }).addTo(map);
    if (g.name === '寶山球館群') L.tooltip({ permanent: true, direction: 'center', className: 'ring-label' }).setLatLng([g.lat - km / 111, g.lon]).setContent(`${km} km`).addTo(map);
  }
  // existing venues
  MAP.venues.forEach((v) => {
    const pub = v.kind === 'public';
    L.marker([v.lat, v.lon], { icon: L.divIcon({ className: '', html: `<div class="vpin${pub ? ' pub' : ''}">${pub ? '公' : v.courts}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }), zIndexOffset: 500 })
      .bindTooltip(v.name.replace(' LongShot', ''), { direction: 'top', offset: [0, -14], className: 'vlabel' })
      .bindPopup(`<b>${esc(v.name)}</b><br><span style="color:#A9B4C2">${esc(v.addr)}</span><br>${v.courts ? v.courts + ' 面場・' : ''}${esc(v.note)}`, { className: 'card' })
      .addTo(map);
  });
  // candidate pins (staggered)
  SITES.sites.forEach((s, i) => setTimeout(() => {
    const m = L.marker([s.lat, s.lng], { icon: icon(s), zIndexOffset: matches(s) ? 1000 : 0, title: s.name, keyboard: true, riseOnHover: true })
      .bindPopup(() => popupHtml(s), { className: 'card', maxWidth: 340, minWidth: 260, autoPanPaddingTopLeft: [innerWidth > 760 ? 380 : 10, 70], autoPanPaddingBottomRight: [20, innerWidth > 760 ? 20 : innerHeight * 0.46] })
      .on('click', () => document.querySelectorAll('.item').forEach((el) => el.classList.toggle('on', el.dataset.id === s.id)))
      .addTo(map);
    markers.set(s.id, m);
  }, RM ? 0 : 120 * i));
}
function hsinchuBounds() { return L.latLngBounds(SITES.sites.map((s) => [s.lat, s.lng]).concat(MAP.venues.map((v) => [v.lat, v.lon]))).pad(0.12); }
function arrive() {
  $('#topbar').hidden = false; $('#legend').hidden = false;
  const pad = { paddingTopLeft: [innerWidth > 760 ? 380 : 10, 70], paddingBottomRight: [20, innerWidth > 760 ? 20 : innerHeight * 0.46] };
  const target = hsinchuBounds();
  const finish = () => { addLayers(); $('#panel').classList.remove('away'); toast('點大圖釘看場地資訊，再按「進入球館」'); map.setMinZoom(8); };
  if (RM) { map.fitBounds(target, pad); finish(); return; }
  setTimeout(() => {
    map.once('moveend', finish);
    map.flyToBounds(target, { ...pad, duration: 3.4, easeLinearity: 0.15 });
  }, 500);
}
async function loadData() {
  const get = (u) => fetch(u, { cache: 'no-store' }).then((r) => r.json());
  [MAP, SITES, CRIT] = await Promise.all([get('data/map.json'), get('data/sites.json'), get('data/criteria.json').catch(() => ({}))]);
  F = store.get('vb.filters', null) || { ...DEF, ping: CRIT.minPing ?? 150, h: CRIT.minHeight ?? 7 };
  bindFilters(); renderList();
  $('#list').addEventListener('click', (e) => { const b = e.target.closest('.item'); if (b) openSite(b.dataset.id); });
}
const ready = loadData();
map.on('popupopen', () => { if (innerWidth <= 760) $('#panel').classList.add('mini'); });
map.on('popupclose', () => $('#panel').classList.remove('mini'));
$('#panel').addEventListener('click', (e) => { if ($('#panel').classList.contains('mini') && e.target.closest('.p-head')) { map.closePopup(); } });

// ================================================================ flow
function go(withAnim) {
  introRun = false;
  const intro = $('#intro');
  if (!withAnim || RM) { intro.style.opacity = 0; setTimeout(() => { intro.hidden = true; }, 400); ready.then(arrive); return; }
  intro.style.opacity = 0;
  setTimeout(() => { intro.hidden = true; }, 500);
  const after = () => {
    const fl = $('#flash'); fl.style.transition = 'none'; fl.style.opacity = 1; cv.hidden = true; $('#anim3d').hidden = true; $('#phase').hidden = true;
    requestAnimationFrame(() => { fl.style.transition = 'opacity .7s'; fl.style.opacity = 0; });
    ready.then(arrive);
  };
  // realistic 3D spike (three.js); falls back to the 2D version if WebGL or the CDN is unavailable
  const c3 = $('#anim3d'), ph = $('#phase');
  import('./spike3d.js').then((m) => {
    c3.hidden = false; ph.hidden = false;
    m.playSpike3D(c3, (name, i, n) => { ph.querySelector('b').textContent = `${i + 1}/${n}`; ph.querySelector('span').textContent = name; }, after);
  }).catch(() => { c3.hidden = true; ph.hidden = true; playSpike(after); });
}
$('#start').addEventListener('click', () => go(true));
$('#ball').addEventListener('click', () => go(true));
$('#skip').addEventListener('click', () => go(false));
$('#replay').addEventListener('click', (e) => { e.preventDefault(); location.href = location.pathname; });
addEventListener('resize', () => { if (!cv.hidden) sizeCanvas(); });
if (location.hash === '#map' || sessionStorage.getItem('vb.seenIntro') === '1' && location.hash !== '#intro') {
  // coming back from the 3D page: skip the intro
  $('#intro').hidden = true; introRun = false; ready.then(() => { map.fitBounds(hsinchuBounds(), { paddingTopLeft: [innerWidth > 760 ? 380 : 10, 70] }); $('#topbar').hidden = false; $('#legend').hidden = false; addLayers(); $('#panel').classList.remove('away'); map.setMinZoom(8);
    const id = new URLSearchParams(location.search).get('site'); if (id) setTimeout(() => openSite(id, true), 1600); });
}
document.addEventListener('click', (e) => { if (e.target.closest('.enter')) { try { sessionStorage.setItem('vb.seenIntro', '1'); } catch (er) {} } });
})();
