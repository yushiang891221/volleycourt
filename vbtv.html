<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>球館 TV｜排球遊戲</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0a1019;color:#e3ebf4}*{box-sizing:border-box}body{margin:0;padding:24px}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #2c3d50;padding-bottom:18px}h1{font-size:22px;margin:0;color:#ffa34b}header span{color:#8194a9;font-size:12px}main{max-width:1200px;margin:24px auto;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px}video{width:100%;max-height:70vh;background:#000;border:1px solid #2c3d50;border-radius:6px}h2{font-size:18px}p{color:#9caec0;font-size:14px;line-height:1.7}aside{display:flex;flex-direction:column;gap:10px}button{padding:18px;text-align:left;font:inherit;line-height:1.6;color:#dfe9f4;background:#141f2e;border:1px solid #35465b;border-radius:5px;cursor:pointer}button[aria-pressed=true]{border-color:#f59532;background:#2c211b;color:#ffb364}button:focus-visible{outline:2px solid #41cbb8}small{display:block;color:#8fa4ba}@media(max-width:700px){main{grid-template-columns:1fr}aside{flex-direction:row}button{flex:1}}
</style>
</head>
<body>
<header><h1>球館 TV</h1><span>VOLLEYBALL · 比賽放映室</span></header>
<main><section><video id="player" controls playsinline preload="metadata" src="video/nandian-2022-fcu-vs-nsysu-v2.mp4"></video><h2 id="title">排球比賽｜逢甲 × 中山</h2><p id="description">一起看比賽，觀察跑位、配合與每一次攻防。</p></section><aside aria-label="影片清單"><button data-video="match" aria-pressed="true">排球比賽<small>逢甲 × 中山 · 完整影片</small></button><button data-video="rally" aria-pressed="false">回合精華<small>發球、接球與攻防片段</small></button></aside></main>
<script>
const videos = {
  match: ['video/nandian-2022-fcu-vs-nsysu-v2.mp4', '排球比賽｜逢甲 × 中山', '一起看比賽，觀察跑位、配合與每一次攻防。'],
  rally: ['video/rally-demo.mp4', '排球回合精華', '看看球員如何串連接球、舉球與攻擊。']
};
document.querySelectorAll('[data-video]').forEach(button => button.addEventListener('click', () => {
  const [src, title, description] = videos[button.dataset.video];
  const player = document.getElementById('player');
  player.pause(); player.src = src;
  document.getElementById('title').textContent = title;
  document.getElementById('description').textContent = description;
  document.querySelectorAll('[data-video]').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
  player.play().catch(() => {});
}));
</script>
</body></html>
