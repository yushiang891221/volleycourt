<style>

#view{position:absolute;inset:0}
#panel{position:absolute;right:14px;top:14px;bottom:14px;width:330px;background:var(--panel);border-radius:16px;box-shadow:0 6px 24px #0002;display:flex;flex-direction:column;overflow:hidden}

.chips button.on{border-color:var(--acc);color:var(--acc)}

.sw.on{box-shadow:0 0 0 2px var(--acc)}
input[type=color]{width:34px;height:30px;border:0;padding:0;background:none;cursor:pointer}

#top{position:absolute;left:14px;top:14px;display:flex;gap:6px}
#top button{border:0;border-radius:999px;padding:8px 14px;background:#fff;box-shadow:0 2px 8px #0001;font:inherit;cursor:pointer}
#top button.on{background:var(--acc);color:#fff}
#msg{position:absolute;left:14px;bottom:14px;color:var(--sub);font-size:12px}

}
// 跳發球預覽的球：左手拿球 → 拋起（真實重力）→ 起跳最高、手伸最高時剛好落到右手被扣 → 往前下方飛出去（＝剛好在完美時機扣到）
const SERVE = { toss: 0.45, hit: SPIKE_HIT + JS_OFF, cache: {} };   // 擊球＝扣球的擊球格＋ JS_OFF
{ const c = document.createElement('canvas'); c.width = 256; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#F2C230'; g.fillRect(0, 0, 256, 128); g.fillStyle = '#2B55B5'; for (let i = 0; i < 3; i++) g.fillRect(i * 86 + 22, 0, 32, 128);

    C = SERVE.cache[M.sx] = { p0, p1, v0, fwd: V(Math.sin(M.yaw0 || 0), 0, Math.cos(M.yaw0 || 0)) };
